kind = "web"
previewPath = "/"
title = "Lynx Wear"
description = "An Arabic-first online store for gym and activewear, with a responsive product catalog, category browsing, and an interactive shopping cart."
version = "1.0.0"
id = "artifacts/gymwear-store"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21493

[services.development]
run = "pnpm --filter @workspace/gymwear-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gymwear-store", "run", "build" ]
serve = "static"
publicDir = "artifacts/gymwear-store/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21493"
BASE_PATH = "/"
